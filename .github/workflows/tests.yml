# The suite, on every push and pull request.
#
# ~7 minutes locally on an idle 8-core box; expect longer on 4 vCPU. Two
# files are most of it -- `test_parity_corpus.py` rebuilds a bot per record
# and is the exactness oracle, `test_poke_rate.py` plays four games and is
# the only behavioural rate the suite measures -- and both earn it.
#
# This exists partly because of 52bb329: a weight default changed, the parity
# corpus was run and passed, and the change was committed. The corpus replays
# each record at its RECORDED weights, so it is structurally blind to a change
# in defaults and could not have caught the behaviour regression that was
# already there. The full suite is the check for that, and a human deciding
# to run it is exactly the step that gets skipped.
name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          # The suite runs `gate.sh --check`, whose default base is HEAD~1.
          # actions/checkout is shallow by default, so HEAD~1 does not exist
          # and four tests in test_gate_script.py fail with
          # `fatal: bad revision 'HEAD~1..HEAD'`. drift.yml already carries
          # this flag with a comment saying it fails silently without it; the
          # lesson was not applied here until CI said so.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      # --extra test, or the sync installs the package and nothing else:
      # pytest, hypothesis, ty and ruff are in [project.optional-dependencies]
      # rather than being runtime deps (the package itself has none).
      - run: uv sync --frozen --extra test
      - run: uv run pytest -q
