# Weight A/Bs, ablations and anchor matchups, sharded, all at once.
#
# The third thing the local queue could not do. `gate.yml` compares
# revisions and `drift.yml` compares anchors; neither runs
# `benchmark --bot-weights`, which is what an experiment actually is -- so
# on 2026-09-12 `scoring_discount 0.93` ran for an hour on the maintainer's
# box while CI sat idle.
#
# ARMS COME FROM .github/experiments.json so adding one is a data change, not
# a workflow change. Dispatch can also take an inline arm for a one-off
# without editing anything.
#
# SHARDED, SO AN ARM CAN BE AS BIG AS THE QUESTION. Each arm's seeds (and
# `held`, if given -- both are just seeds here) are cut into shards of
# `shard` seeds (default 128), one job per shard, and the `collect` job pools
# them with scripts/pool_reports.py, which reuses `benchmark.summarize` so a
# pooled reading is computed the way a single run's is. One 128-seed shard
# is 30-65 minutes on a 4 vCPU runner; 1024 seeds in one job would be 4-9
# hours against GitHub's 6-hour ceiling, which is why the old per-arm job
# capped arms at 256 and read +/-0.06 on questions that needed +/-0.02.
# 1024 seeds reads about +/-0.016 one-sided.
#
# No early stopping. `--decide` saved wall time on a box that runs one thing
# at a time; on shards it saves nothing (every shard still has to finish for
# the pooled reading) and it cannot see the pooled sample anyway.
#
# OPPONENTS. Default: the same code with default weights, a plain weight
# A/B. `anchor: <ref>` plays the arm against that revision's bot instead
# (snapshotted exactly as the gate and the drift canary do), which is what an
# ablation has to be measured against when the question is "which piece lost
# strength against the old bot" -- measuring it against HEAD only asks
# whether HEAD beats itself, and intransitivity is the thing under suspicion.
# `bot_ref: <ref>` makes the CHALLENGER an old revision too, for
# anchor-vs-anchor readings. Any arm with a ref pins both seats to
# italy/austria unless it names `openings`, for the same reason drift.yml
# does: two revisions' defaults are not the same board.
#
# `"logs": true` also uploads every game's INFO log.
#
# `compare_to: <slug>` asks `collect` for a seed-by-seed paired difference
# against another arm. Arms on the same seeds and the same opponent share
# every deal; the paired difference cancels the deal and resolves about
# twice as finely as comparing two intervals.
#
# Matrix jobs run ~20 at a time on a public repo, so 8 arms of 1024 seeds is
# 64 jobs in about four waves: an overnight run, not an hour.
#
# SHARDS ARE CACHED, because a shard's report is reproducible. A benchmark
# game is `Engine.new_game(seed=...)` driven by two deterministic players
# with chance as a logged CHANCE decision (mandate #3), so the same code,
# weights, opponent, openings and seeds give the same report every time.
# `scripts/arm_identity.py` hashes exactly those, and it hashes the tree of
# `src/` -- not of `src/struggler/bots` -- because the engine decides what a
# play does and `src/struggler/data` holds the cards.
#
# What this buys is not speed for its own sake. On 2026-09-21 one hung shard
# forced a 16-shard re-dispatch to recover a single 128-seed slice, and the
# other 15 replayed answers already known to the thousandth. It also makes a
# re-dispatch of an unchanged arm nearly free, so re-running one is no longer
# a reason to hesitate.
#
# Three things the cache deliberately does NOT do:
#   - restore for an arm with `"logs": true` (the key covers the report, and
#     a hit has no INFO logs to upload);
#   - save a shard whose benchmark exited nonzero, stall (exit 6) included --
#     a stalled shard's report is a PARTIAL reading and caching it would
#     serve that partial forever;
#   - fall back to a prefix (`restore-keys`), which would serve a different
#     shard.
# `no_cache: true` on dispatch bypasses the restore while still saving, which
# is how you check that a replay reproduces a cached reading.
#
# Cache scope is GitHub's, not ours: a branch reads its own entries and the
# default branch's, and writes only to its own. So dispatching from `main`
# builds the shared pool and dispatching from a branch draws on it without
# polluting it -- which is the behaviour you want, but it does mean two
# dispatches from two different branches do not share what they played.
#
# ARMS RUN IN TWO WAVES. Half of each arm's shards, then a look
# (`scripts/wave_verdict.py`), then the rest only for the arms the look did
# not settle. The boundary is pre-declared O'Brien-Fleming: |z| >= 2.373 at
# the interim, which raises the final bar from 1.645 to 1.678 -- a 2% wider
# final interval, for half the seeds on every arm that was never close. It
# fails open: anything unreadable plays the second wave. AN ARM THAT STOPPED
# EARLY REPORTS ON HALF ITS SEEDS, deliberately; `interim`'s verdict is
# uploaded and printed to the run summary so that is visible rather than
# looking like missing shards. `waves: false` plays everything at once,
# which is what a LEVEL reading wants (drift.yml passes it).
name: experiments

on:
  workflow_dispatch:
    inputs:
      only:
        description: 'Run these arms by slug, comma-separated (blank = every arm in experiments.json)'
        default: ''
      inline:
        description: 'One-off arm as JSON, e.g. {"slug":"try","weights":{"region":1.0},"seeds":"9100-9611","anchor":"v0.2.1","title":"t","context":"c"}'
        default: ''
      no_cache:
        description: 'Replay every shard instead of restoring cached ones (results are still saved)'
        type: boolean
        default: false
      waves:
        description: 'Play half the seeds, look, and play the rest only for arms the look did not settle'
        type: boolean
        default: true
  # Callable, so another workflow can hand it a list of arms and get the
  # sharding, pooling and paired readings without a second copy of them.
  # drift.yml is the caller: each anchor becomes an anchored arm.
  workflow_call:
    inputs:
      arms:
        description: 'JSON list of arms in the experiments.json schema; replaces the file'
        type: string
        default: ''
      only:
        type: string
        default: ''
      inline:
        type: string
        default: ''
      no_cache:
        type: boolean
        default: false
      waves:
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.pick.outputs.shards }}
      count: ${{ steps.pick.outputs.count }}
      wave2: ${{ steps.pick.outputs.wave2 }}
      wave2_count: ${{ steps.pick.outputs.wave2_count }}
    steps:
      - uses: actions/checkout@v4
      - id: pick
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          WAVES = os.environ.get('WAVES', '') == 'true'
          inline = os.environ.get('INLINE', '').strip()
          given = os.environ.get('ARMS', '').strip()
          only = [x.strip() for x in os.environ.get('ONLY', '').split(',') if x.strip()]
          if given:
              arms = json.loads(given)
          elif inline:
              arms = [json.loads(inline)]
          else:
              arms = json.load(open('.github/experiments.json'))['experiments']
              if only:
                  unknown = set(only) - {a['slug'] for a in arms}
                  assert not unknown, f'no such arm(s): {sorted(unknown)}'
                  arms = [a for a in arms if a['slug'] in only]
          # A matrix over an empty list is a workflow error, not an empty run,
          # so say so plainly instead of failing with a YAML message.
          assert arms, ('no arms to run: experiments.json is empty and no inline '
                        'arm was given. Add one to .github/experiments.json.')
          seen = [a['slug'] for a in arms]
          assert len(set(seen)) == len(seen), f'duplicate slugs: {seen}'
          for a in arms:
              assert '--' not in a['slug'], f"{a['slug']}: '--' separates slug from shard"
              # `--bot-weights` builds HEAD's StrategicWeights and hands it to
              # whatever class the challenger is, so an old revision would
              # play HEAD's weights instead of its own -- silently, when the
              # field names still match.
              assert not (a.get('bot_ref') and a.get('weights')), (
                  f"{a['slug']}: weights apply to HEAD's bot only; drop bot_ref or weights")
              if a.get('compare_to'):
                  assert a['compare_to'] in seen, (
                      f"{a['slug']}: compare_to {a['compare_to']!r} is not in this run")
          def span(text):
              lo, hi = (int(x) for x in text.split('-'))
              return list(range(lo, hi + 1))
          shards = []
          for a in arms:
              blocks = [span(a['seeds'])] + ([span(a['held'])] if a.get('held') else [])
              flat = [x for b in blocks for x in b]
              assert len(set(flat)) == len(flat), f"{a['slug']}: seeds and held overlap"
              size = int(a.get('shard', 128))
              # Cut each block separately so no shard straddles a gap.
              chunks = [b[i:i + size] for b in blocks for i in range(0, len(b), size)]
              openings = a.get('openings') or (
                  'US=italy,USSR=austria' if (a.get('anchor') or a.get('bot_ref')) else '')
              # "default": each side plays its own revision's default book --
              # for an anchor that does not know the requested ones (drift.yml
              # asks gate_common.sh's `opening_args`, as drift_check.sh does).
              if openings == 'default':
                  openings = ''
              for i, chunk in enumerate(chunks):
                  shards.append({
                      'slug': a['slug'], 'shard': i, 'of': len(chunks),
                      'seeds': f'{chunk[0]}-{chunk[-1]}',
                      'weights': a.get('weights') or {},
                      'anchor': a.get('anchor', ''), 'bot_ref': a.get('bot_ref', ''),
                      'openings': openings, 'compare_to': a.get('compare_to', ''),
                      'logs': bool(a.get('logs')),
                  })
          assert len(shards) <= 256, f'{len(shards)} shards; a matrix holds 256'
          # WAVES. Half the shards of each arm now, the rest only where the
          # interim look does not settle the question. The split is by arm
          # and in shard order, so two arms on the same block and the same
          # shard size play the SAME seeds in wave 1 -- which is what the
          # paired interim reads. `ceil` puts the odd shard in wave 1: the
          # look is the thing being paid for, so it gets the extra seeds.
          #
          # `waves: false` runs everything at once, which is what a LEVEL
          # reading wants (drift.yml): halving the seeds doubles the
          # interval, and a canary's number is quoted, not compared.
          wave1, wave2 = shards, []
          if WAVES:
              by_arm = {}
              for s in shards:
                  by_arm.setdefault(s['slug'], []).append(s)
              wave1, wave2 = [], []
              for arm_shards in by_arm.values():
                  cut = -(-len(arm_shards) // 2)
                  wave1 += arm_shards[:cut]
                  wave2 += arm_shards[cut:]
          print(f'shards={json.dumps(wave1)}')
          print(f'count={len(wave1)}')
          print(f'wave2={json.dumps(wave2)}')
          print(f'wave2_count={len(wave2)}')
          PY
        env:
          WAVES: ${{ inputs.waves }}
          # `inputs`, not `github.event.inputs`: the one context both a
          # dispatch and a workflow_call fill.
          INLINE: ${{ inputs.inline }}
          ONLY: ${{ inputs.only }}
          ARMS: ${{ inputs.arms }}

  run:
    needs: plan
    # Without this the job is titled from EVERY matrix field, so a run reads
    # `run (smoke, 1.3, 9100-9103, ...)` and the arm you are looking for is
    # unfindable in a list of sixty.
    name: ${{ matrix.s.slug }} [${{ matrix.s.shard }}/${{ matrix.s.of }}]
    runs-on: ubuntu-latest
    # One 128-seed shard measured 30-65 minutes; this leaves room for a slow
    # runner without letting a hang eat the 6-hour ceiling.
    timeout-minutes: 180
    strategy:
      # An arm coming back surprising is a RESULT. Cancelling its siblings
      # throws away the comparison that makes a set of arms worth more than
      # the sum of its runs.
      fail-fast: false
      matrix:
        s: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      # Full history: an `anchor` or `bot_ref` is snapshotted with `git
      # archive`, as gate.yml and drift.yml do.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      # Base sync is enough: the package declares no runtime dependencies and
      # the benchmark is stdlib. ruff and ty are only needed by the gate.
      - run: uv sync --frozen
      - uses: ./.github/actions/run-shard
        with:
          shard: ${{ toJSON(matrix.s) }}
          no_cache: ${{ inputs.no_cache }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: experiment-${{ matrix.s.slug }}--${{ matrix.s.shard }}
          path: |
            ${{ matrix.s.slug }}.json
            arm.json
            arm.weights.json
            game-logs/
          retention-days: 30

  # THE LOOK. Pool wave 1 and ask, per arm, whether wave 2 can still change
  # the answer. `scripts/wave_verdict.py` holds the rule and the reason the
  # boundary is where it is; the short version is that two chances to clear a
  # bar are easier than one, so the interim bar is raised to 2.373 and the
  # final one to 1.678 -- a 2% wider final interval, for half the seeds on
  # every arm that was never close.
  #
  # `if: always()` and not `success()`: a wave-1 shard that crashed is a
  # reason to PLAY wave 2, not to skip the decision and thereby play it. The
  # script fails open on every unreadable path for the same reason.
  interim:
    needs: [plan, run]
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.wave2_count != '0'
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.look.outputs.shards }}
      count: ${{ steps.look.outputs.count }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen
      - uses: actions/download-artifact@v4
        with:
          pattern: experiment-*
          path: shards
      - id: look
        run: |
          set -euo pipefail
          echo "$WAVE2" > wave2.json
          uv run python scripts/pool_reports.py shards --json interim.json > interim.md
          { echo '## Interim (wave 1)'; cat interim.md; } >> "$GITHUB_STEP_SUMMARY"
          uv run python scripts/wave_verdict.py interim.json \
            --wave2 wave2.json --out next.json | tee verdict.md
          cat verdict.md >> "$GITHUB_STEP_SUMMARY"
          echo "shards=$(cat next.json)" >> "$GITHUB_OUTPUT"
          echo "count=$(uv run python -c 'import json;print(len(json.load(open("next.json"))))')" >> "$GITHUB_OUTPUT"
        env:
          WAVE2: ${{ needs.plan.outputs.wave2 }}
      - uses: actions/upload-artifact@v4
        with:
          name: interim
          path: |
            interim.json
            interim.md
            verdict.md
            next.json
          retention-days: 90

  run2:
    needs: [plan, interim]
    if: always() && needs.interim.result == 'success' && needs.interim.outputs.count != '0'
    name: ${{ matrix.s.slug }} [${{ matrix.s.shard }}/${{ matrix.s.of }}] w2
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        # `|| '[]'` is not a default anyone should hit: the job's `if` skips
        # it whenever `interim` did not run or selected nothing. It is here
        # because a matrix that fails to PARSE is a workflow error, and a
        # workflow error on wave 2 would be reported as a failed experiment.
        s: ${{ fromJSON(needs.interim.outputs.shards || '[]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen
      - uses: ./.github/actions/run-shard
        with:
          shard: ${{ toJSON(matrix.s) }}
          no_cache: ${{ inputs.no_cache }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: experiment-${{ matrix.s.slug }}--${{ matrix.s.shard }}
          path: |
            ${{ matrix.s.slug }}.json
            arm.json
            arm.weights.json
            game-logs/
          retention-days: 30

  collect:
    needs: [plan, run, interim, run2]
    # Pool whatever finished: a shard that crashed or timed out is listed as
    # MISSING next to its arm rather than silently pooled around.
    #
    # An arm the interim stopped reports on wave 1 alone, and its `shards`
    # count says so. That is not a missing shard -- it is the design -- but
    # the two read alike in the table, which is why `interim`'s verdict is
    # uploaded as its own artifact and printed to the run summary.
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen
      - uses: actions/download-artifact@v4
        with:
          pattern: experiment-*
          path: shards
      - name: pool
        run: |
          uv run python scripts/pool_reports.py shards --json pooled.json | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: pooled
          path: pooled.json
          retention-days: 90
