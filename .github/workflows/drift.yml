# The drift canary: every anchor at once, 1024 seeds each, sharded.
#
# This is the thing a local machine cannot do. `scripts/gate.sh` enforces one
# run at a time with a lock, because eight shared cores mean two runs halve
# each other's speed and corrupt both sets of timings. A hosted runner is
# isolated, so bisecting drift stops being sequential. Ask every tag in one
# pass and read where the drift entered from the table.
#
# 1024 SEEDS, BY WAY OF experiments.yml (2026-09-18). One job per anchor at
# 128 seeds read +/-0.045, too blunt for a drift the 1024-seed readings put at
# a third of the 128-seed estimate (docs/notes/claude/
# 2026-09-18-drift-located-at-v0.2.1-v0.2.3.md), and 1024 seeds in one job is
# 4-9 hours against GitHub's 6-hour ceiling. experiments.yml already shards
# an arm into 128-seed jobs and pools them, so this workflow no longer runs
# games itself. It turns each anchor into an anchored arm and calls
# experiments.yml, then applies the canary's verdict to the pooled readings
# (scripts/drift_verdict.py: DRIFT when the one-sided 95% upper bound is
# below 0.500, drift_check.sh's rule). Nine anchors at 1024 seeds are 72
# shard jobs, about four waves at ~20 concurrent: hours, not days.
#
# What still lives in scripts: the anchor rules. An anchor older than the
# package split is skipped (`snapshot ... optional`), and one that does not
# know the requested books plays its own default (`opening_args`). Both are
# in scripts/lib/gate_common.sh, shared with drift_check.sh, which stays the
# local canary.
name: drift

on:
  workflow_dispatch:
    inputs:
      # EVERY tag, one arm each, the maintainer's call (2026-09-17): with all
      # of them, "which week did it enter" and "which merge did it enter" are
      # the same run.
      #
      # `07d553a` is the one anchor here that is not a tag. It is #100 of
      # v0.2.1..v0.2.2, the plateau bot every experiment arm is anchored
      # against and the boundary the drift has been tracked to since
      # 2026-09-18. Reading it in the canary puts the arms' opponent on the
      # canary's block, where it can be compared with the tags either side.
      #
      # v0.3.2 (hand safety, +0.043 against 07d553a), v0.3.3 (the guard at
      # its measured 0.43, the fitted weights measured and off) and v0.3.4
      # (the region margin deleted) were tagged 2026-09-19 so this week's
      # states are anchors and not only history. 13 anchors x 8 shards is
      # 104 jobs, which is why this is weekly and not per-merge.
      #
      # v0.1.0 predates the opening books and plays its own default rather
      # than the canary's italy/austria. Its reading is therefore on a
      # different board from the others and is not commensurable with them --
      # it is kept because it is the oldest state believed sound.
      anchors:
        description: 'JSON list of refs to measure against'
        default: '["v0.1.0", "v0.2.0", "v0.2.1", "07d553a", "v0.2.2", "v0.2.3", "v0.2.4", "v0.2.5", "v0.3.0", "v0.3.1", "v0.3.2", "v0.3.3", "v0.3.4"]'
      # The same block for every anchor, so the readings are commensurable.
      # It extends the old 128-seed canary block (6000-6127), which is its
      # first shard.
      seeds:
        description: 'Seed range, the same for every anchor (1024 = 8 shards of 128)'
        default: '6000-7023'
      # Both arms must play the SAME opening or the reading is confounded by
      # the board rather than by the code. Blank keeps italy/austria, which is
      # what DEFAULT_OPENINGS ships and what every anchor from v0.2.0 on knows.
      books:
        description: 'Opening books both arms play, e.g. US=france,USSR=poland (blank = italy/austria)'
        default: ''
  schedule:
    # Sunday 03:00 UTC. Drift is a slow signal; weekly is often enough.
    - cron: '0 3 * * 0'

permissions:
  contents: read

jobs:
  anchors:
    runs-on: ubuntu-latest
    outputs:
      arms: ${{ steps.arms.outputs.arms }}
    steps:
      - uses: actions/checkout@v4
        with:
          # REQUIRED: `snapshot` runs `git archive <anchor>`, which needs the
          # tags and the history a shallow checkout does not have.
          fetch-depth: 0
      - id: arms
        env:
          ANCHORS: ${{ inputs.anchors || '["v0.1.0", "v0.2.0", "v0.2.1", "07d553a", "v0.2.2", "v0.2.3", "v0.2.4", "v0.2.5", "v0.3.0", "v0.3.1", "v0.3.2", "v0.3.3", "v0.3.4"]' }}
          SEEDS: ${{ inputs.seeds || '6000-7023' }}
          DRIFT_BOOKS: ${{ inputs.books }}
        run: |
          set -euo pipefail
          . scripts/lib/gate_common.sh
          # Unset, not empty, when no override is given: opening_args reads
          # `${DRIFT_OPENINGS-default}`, so an EMPTY value would mean "each
          # side plays its own default" for every anchor.
          if [ -n "${DRIFT_BOOKS:-}" ]; then export DRIFT_OPENINGS="$DRIFT_BOOKS"; fi
          : > arms.jsonl
          for anchor in $(python3 -c 'import json, os; print(" ".join(json.loads(os.environ["ANCHORS"])))'); do
            ANCHOR_OK=1
            snapshot "$anchor" "snap/$anchor" optional
            if [ "$ANCHOR_OK" != 1 ]; then
              echo "- \`$anchor\`: SKIPPED, predates the package split" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi
            flag=$(opening_args "snap/$anchor")
            books=${flag#--openings }
            [ -n "$flag" ] || books=default
            echo "- \`$anchor\`: openings $books" >> "$GITHUB_STEP_SUMMARY"
            python3 - "$anchor" "$books" "$SEEDS" >> arms.jsonl <<'PY'
          import json, sys
          anchor, books, seeds = sys.argv[1:]
          print(json.dumps({'slug': f'drift-{anchor}', 'anchor': anchor, 'seeds': seeds,
                            'openings': books,
                            'title': f'drift: HEAD vs {anchor}', 'context': 'drift.yml canary'}))
          PY
          done
          echo "arms=$(python3 -c 'import json; print(json.dumps([json.loads(l) for l in open("arms.jsonl")]))')" \
            >> "$GITHUB_OUTPUT"

  measure:
    needs: anchors
    uses: ./.github/workflows/experiments.yml
    with:
      arms: ${{ needs.anchors.outputs.arms }}

  verdict:
    needs: [anchors, measure]
    # Read whatever pooled: a crashed shard is INCOMPLETE in the verdict, not
    # silently pooled around.
    if: always() && needs.anchors.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: pooled
          path: pooled
      # THE EXIT STATUS IS THE VERDICT: 1 is drift against at least one
      # anchor, 3 an incomplete reading. Wall time from a shared runner is not
      # quotable; the verdict is.
      - name: drift verdict
        run: |
          set -o pipefail
          { echo '### drift verdict'; echo; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          status=0
          python3 scripts/drift_verdict.py pooled/pooled.json | tee -a "$GITHUB_STEP_SUMMARY" || status=$?
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit $status
