[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "struggler"
version = "0.3.1"
description = "Rules engine for Twilight Struggle."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

[project.optional-dependencies]
# `pyyaml` is for the tests that read `.github/workflows/` and the composite
# action beside them. Those are the parts of the repo whose mistakes only
# surface on a dispatched runner an hour later, so they are worth parsing
# rather than grepping; nothing under `src/` imports it.
test = ["pytest", "hypothesis", "ty", "ruff", "pyyaml"]
llm-anthropic = ["anthropic>=0.68"]
llm-openai = ["openai>=1.0"]
llm = ["anthropic>=0.68", "openai>=1.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
struggler = ["data/*.json"]
"struggler.bots.llm" = ["*.json"]
"struggler.bots.strategic" = ["*.json"]


# -- static checking ---------------------------------------------------------
# Both are advisory, not gates: the codebase was never type-checked and has a
# backlog (248 ty diagnostics at `--error all`, 420 ruff findings on the
# default rules). Working through it is queued, not a precondition. What
# earns them their place is what each caught the day they were tried:
#   ty    -- `CARDS[c].side is Side.US` compares a CardSide against a Side and
#            is therefore always False. The term ran, priced nothing, and
#            returned a plausible zero. mypy missed it in both the `is` and
#            `==` forms; pyright, basedpyright and ty all caught it.
#   ruff  -- `assert key.startswith('_') or key in CARDS or True`, an
#            assertion that cannot fail, sitting in the test suite. That is
#            shape 8 in docs/notes/claude/bug-shapes.md, found mechanically.
[tool.ty.src]
# `src/` only. Tests hold 419 of the 502 `unresolved-attribute` findings --
# they poke private state on purpose -- and both `unsupported-operator`
# false positives were test code using heterogeneous dicts and lists.
include = ["src/struggler"]

[tool.ty.rules]
# Chosen by counting, not taste. Each rule below was read finding by
# finding on 2026-09-11 and kept only where real positives outnumbered
# false ones, which is the maintainer's rule:
#
#   rule                          true  false  verdict
#   unsupported-operator             1*     0  KEEP  (*the CardSide bug; the
#                                                     two FPs were in tests)
#   possibly-unresolved-reference    3      0  KEEP
#   call-non-callable                2      0  KEEP
#   invalid-method-override          1      0  KEEP
#   redundant-condition-strict       1      2  OFF
#   not-iterable                     0      2  OFF
#   too-many-positional-arguments    0      1  OFF
unsupported-operator = "error"
possibly-unresolved-reference = "error"
call-non-callable = "error"
invalid-method-override = "error"

# `redundant-condition-strict` is off for a reason worth keeping, because
# the obvious response to it would have *introduced* a defect. ty narrows a
# property across a mutating call: after `if engine.is_terminal: return` it
# treats `is_terminal` as permanently false, so the next
# `not engine.is_terminal` reads as always true -- ignoring that the
# intervening `_change_defcon(-1)` can reach DEFCON 1, call `_win`, and end
# the game. Both flagged guards in events.py are load-bearing, and deleting
# them would let a finished game keep awarding VP. In an engine built on
# properties over mutable state this will be the common case, and the
# failure direction is the dangerous one: the "fix" looks like tidying.
redundant-condition-strict = "ignore"
not-iterable = "ignore"
too-many-positional-arguments = "ignore"
# The optional LLM SDKs are genuinely absent unless the extra is installed.
unresolved-import = "ignore"

[tool.ruff]
line-length = 110          # the prose-in-comments style runs long by design
target-version = "py312"

[tool.ruff.lint]
# Correctness first. The style families (E501 and friends) are deliberately
# not selected: reformatting a codebase whose comments carry the reasoning
# would churn every line and hide the next real finding.
select = ["F", "B", "SIM", "RUF", "PLE", "PLW",
          # Added 2026-09-13, counted first (src+tests+scripts): C4 42, PERF 5,
          # FURB 5, RET 3, PIE 3 -- dead comprehensions and loop costs that sit
          # on the ranking hot path, and redundant returns and branches.
          "C4", "PERF", "RET", "PIE", "FURB",
          # ARG, scoped to the evaluator below. Its first real finding was
          # `country_value`'s `defcon` and `bans`, left dead when the wipe term
          # was deleted; everywhere else its 174 hits are arguments a protocol
          # or a dispatch table requires (`Player.choose_action`'s `history`,
          # the per-kind score arms), which it cannot tell from dead ones.
          "ARG"]
# Deliberately NOT selected, measured 2026-09-13 rather than assumed:
#   UP  (pyupgrade)    189 in src -- syntax modernisation, no defect to find
#   TRY (tryceratops)   68 in src -- exception-style preferences
# Both would churn lines whose comments carry the reasoning, for nothing a
# review would call a bug.
ignore = [
    "SIM105",  # `contextlib.suppress` is slower and this is a hot path
    "RUF012",  # ClassVar annotations on mutable defaults: noise here
]

[tool.ruff.lint.per-file-ignores]
# ARG everywhere except the evaluator, whose pure functions are the snapshot
# contract a native port receives (docs/STRATEGIC_AI.md): an argument there
# is either read or dead, and a dead one is a contract nobody honours.
"!src/struggler/bots/strategic/evaluator.py" = ["ARG"]
